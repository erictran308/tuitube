# Catppuccin Mocha, tuitube's default theme: https://catppuccin.com/palette
#
# The same sixteen-color palettes as tuigram and tuimeta. `T` in tuitube
# goes round the built-in ones; settings.toml keeps the one picked.

name = "Catppuccin Mocha"

# What tuitube paints with each. Colors are "#rrggbb".
[palette]
bg = "#1e1e2e"       # the background
bg_alt = "#181825"   # the sidebar, the search box and popups
surface = "#313244"  # the selected row, a thumbnail still loading
overlay = "#6c7086"  # the ring of a card when the sidebar has the keys, the unwatched part of a video
comment = "#7f849c"  # key hints, descriptions, placeholders
subtext = "#a6adc8"  # channel names, views and age
fg = "#cdd6f4"       # titles and text
red = "#f38ba8"      # errors, the logo, the watched part of a video
orange = "#fab387"   # channel initials
yellow = "#f9e2af"   # warnings, channel initials
green = "#a6e3a1"    # what worked, channel initials
cyan = "#94e2d5"     # (tuigram's replies; unused here)
blue = "#89b4fa"     # (tuigram's Normal mode; unused here)
purple = "#cba6f7"   # (tuigram's Command mode; unused here)
pink = "#f5c2e7"     # (tuigram's names in groups; unused here)
accent = "#b4befe"   # what has the keys: the selected card's ring, the cursor, popups

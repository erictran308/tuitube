[package]
name = "tuitube"
version = "0.1.0"
edition = "2024"
description = "YouTube in your terminal: a vim-style client with local subscriptions, built on yt-dlp and mpv"
license = "MIT"
repository = "https://github.com/erictran308/tuitube"
readme = "README.md"
# Not published anywhere yet: see reports/YouTube terminal client.md on what
# publishing a YouTube client exposes its author to.
publish = false
keywords = ["youtube", "tui", "terminal", "mpv", "vim"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", ".env.example", ".github", "docs", "reports", "research_notes"]

[[bin]]
name = "tuitube"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = "1.4"
dirs = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
# Pure-Rust decoders for the formats YouTube serves thumbnails and channel
# photos in, and nothing else: no AVIF (libdav1d, C) or the rarer formats.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
quick-xml = "0.42"
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "tuitube"
version = "0.2.0"
edition = "2024"
description = "YouTube in your terminal: a vim-style client with local subscriptions, built on yt-dlp and mpv"
license = "MIT"
repository = "https://github.com/erictran308/tuitube"
readme = "README.md"
rust-version = "1.90"
keywords = ["youtube", "tui", "terminal", "mpv", "vim"]
categories = ["command-line-utilities"]
# What goes into the published crate, and nothing else (no research notes,
# screenshots, tools or stray files).
include = ["src/**/*.rs", "themes/*.toml", "README.md", "LICENSE", "SECURITY.md", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "tuitube"
path = "src/main.rs"

# `cargo binstall tuitube` takes the binary from the GitHub release, built by
# .github/workflows/release.yml; without one for the computer, it builds from
# source. QuickInstall's binaries, which aren't built here, are never used.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tuitube-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "tuitube{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tuitube-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/tuitube-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = "1.4"
dirs = "7.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
# Pure-Rust decoders for the formats YouTube serves thumbnails and channel
# photos in, and nothing else: no AVIF (libdav1d, C) or the rarer formats.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
quick-xml = "0.42"
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
# rustls with ring for its cryptography: aws-lc-rs, reqwest's default, needs
# NASM to build on Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# SHA-256 for SponsorBlock's hash prefix: the ring rustls already builds.
ring = "0.17.14"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
